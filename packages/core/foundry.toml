# Default profile for main contracts (OZ v4)
[profile.default]
src = 'contracts'
out = 'out'
test = 'test/foundry'
cache_path = 'forge-cache'
libs = ['node_modules', 'lib']
allow_paths = ["../../node_modules"]
ignored_error_codes = [5574]  # Ignore SPDX license warnings
fs_permissions = [{ access = "read", path = "./"}]

# Auto-detect solc version from pragma statements
evm_version = "paris"
optimizer = true
optimizer_runs = 1000000

remappings = [
    "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=../../node_modules/@openzeppelin/contracts-upgradeable/",
    "@uniswap/=../../node_modules/@uniswap/",
    "@gnosis.pm/=../../node_modules/@gnosis.pm/",
    "@maticnetwork/=../../node_modules/@maticnetwork/",
    "@eth-optimism/=../../node_modules/@eth-optimism/",
    "ds-test/=lib/forge-std/lib/ds-test/src/",
    "forge-std/=lib/forge-std/src/",
]

# Profile for dispute-router contracts (OZ v5)
[profile.dispute-router]
src = 'dispute-router/src'
out = 'out/dispute-router'
test = 'dispute-router/test'
script = 'dispute-router/script'
cache_path = 'forge-cache-dispute-router'
libs = ['node_modules', 'lib', 'dispute-router/lib']
allow_paths = ["../../node_modules", "contracts"]
fs_permissions = [{ access = "read", path = "./"}]
auto_detect_remappings = false

solc_version = "0.8.22"
evm_version = "paris"
optimizer = true
optimizer_runs = 1000000
via_ir = false

# Required for OpenZeppelin Foundry Upgrades plugin
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

# Remappings for dispute-router
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts-v5/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable-v5/",
    "@openzeppelin/foundry-upgrades/=dispute-router/lib/openzeppelin-foundry-upgrades/src/",
    "@uma/core/=contracts/",
    "forge-std/=dispute-router/lib/openzeppelin-foundry-upgrades/lib/forge-std/src/",
]

# Test configuration
fuzz_runs = 256
verbosity = 2

[profile.ci]
fuzz_runs = 10000
verbosity = 3

[profile.intense]
fuzz_runs = 50000
invariant_runs = 256

# Formatting configuration
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"
